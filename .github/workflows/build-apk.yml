name: Build English Logic APK

on:
  push:
    branches: [english-logic-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore bundled English Logic course
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/www
          cat .github/web-assets/web-assets.part.* > /tmp/english-logic-web.zip
          unzip -q /tmp/english-logic-web.zip -d app/src/main/assets/www
          test -f app/src/main/assets/www/index.html
          grep -R -q "english-logic-local-progress-v2" app/src/main/assets/www
          grep -R -q "english-logic-local-identity-v1" app/src/main/assets/www
          grep -R -q "Bật giao diện tối" app/src/main/assets/www
          grep -R -q "Đồng bộ với máy tính" app/src/main/assets/www
          grep -R -q "Tạo QR và mã ghép nối" app/src/main/assets/www
          grep -R -q "englishlogic:pairing-scan" app/src/main/assets/www
          if grep -R -Eiq "auth\.openai\.com|Tiếp tục với ChatGPT|client_id|code_verifier|code_challenge" app/src/main/assets/www; then
            echo "OAuth/login marker found in bundled content"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build installable debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          unzip -l app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-contents.txt
          grep -q "assets/www/_next/static/chunks/.*\.js" /tmp/apk-contents.txt
          grep -q "assets/www/_next/static/chunks/.*\.css" /tmp/apk-contents.txt
          test "$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)" -gt 300000
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test offline persistence on Pixel 5 / Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: sh .github/scripts/test-offline-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: English-Logic-v1.3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
