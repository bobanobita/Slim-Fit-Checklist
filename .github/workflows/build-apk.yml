name: Build English Logic APK

on:
  push:
    branches: [english-logic-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore bundled English Logic course
        run: |
          mkdir -p app/src/main/assets/www
          cat .github/web-assets/web-assets.part.* > /tmp/english-logic-web.zip
          unzip -q /tmp/english-logic-web.zip -d app/src/main/assets/www
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test fresh install offline on Pixel 5 / Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am force-stop vn.englishlogic.app
            adb shell am start -W -n vn.englishlogic.app/.MainActivity
            sleep 8
            adb shell dumpsys activity activities > /tmp/activities.txt
            grep -q "vn.englishlogic.app/.MainActivity" /tmp/activities.txt
            adb shell uiautomator dump /sdcard/english-logic-window.xml
            adb pull /sdcard/english-logic-window.xml /tmp/english-logic-window.xml
            grep -q "English Logic" /tmp/english-logic-window.xml
            if grep -Eiq "auth\.openai\.com|Tiếp tục với ChatGPT|Đăng nhập" /tmp/english-logic-window.xml; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: English-Logic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
